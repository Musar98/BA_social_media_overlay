image: androidsdk/android-34:latest

stages:
  - build
  - test
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - chmod +x ./gradlew

build-android:
  stage: build
  script:
    - ./gradlew clean assembleDebug --no-daemon

unit-tests:
  stage: test
  script:
    - ./gradlew test --no-daemon

lint:
  stage: test
  script:
    - ./gradlew lint --no-daemon

deploy:
  stage: deploy
  script:
    - echo "Deploy placeholder"
  when: manual