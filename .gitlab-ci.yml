stages:
  - build
  - test
  - deploy

# -------------------------
# BUILD (Android + JS via Gradle)
# -------------------------
build-android:
  stage: build
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - chmod +x ./gradlew
  script:
    - ./gradlew clean assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/
    expire_in: 1 week

# -------------------------
# UNIT TESTS (Android + JVM)
# -------------------------
unit-tests:
  stage: test
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - chmod +x ./gradlew
  script:
    - ./gradlew test --no-daemon

# -------------------------
# OPTIONAL: Android lint
# -------------------------
lint:
  stage: test
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - chmod +x ./gradlew
  script:
    - ./gradlew lint --no-daemon

# -------------------------
# DEPLOY (placeholder for now)
# -------------------------
deploy:
  stage: deploy
  script:
    - echo "Deploy step placeholder"
    - echo "If needed, connect Firebase App Distribution or Play Store here"
  when: manual