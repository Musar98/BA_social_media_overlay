[project]
name = "social-media-overlay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "kornia>=0.8.2",
    "matplotlib>=3.10.8",
    "onnx>=1.21.0",
    "onnxscript>=0.6.2",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "py>=1.11.0",
    "pytest>=9.0.3",
    "scikit-image>=0.26.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "timm>=1.0.26",
    "torch>=2.10.0", # https://docs.pytorch.org/docs/versions.html
    "torch-fidelity>=0.4.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.25.0", # https://docs.pytorch.org/vision/versions.html
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [ { index="pytorch-cu126" } ]
torchvision = [ { index="pytorch-cu126" } ]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "integration: tests that require external models, downloads, or GPU/CLIP setup",
]
filterwarnings = [
    "ignore:`torch.jit.load` is deprecated:DeprecationWarning",
]